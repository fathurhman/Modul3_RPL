name: Python CI Pipeline - Sistem Perpustakaan

# Pipeline akan berjalan otomatis saat ada push atau pull request ke branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Mengambil Kode dari Repositori (Checkout)
      uses: actions/checkout@v4

    - name: 2. Menyiapkan Lingkungan Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 3. Menginstal Dependensi Proyek
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Menjalankan Automated Unit Testing (Pytest)
      run: |
        python -m pytest -v