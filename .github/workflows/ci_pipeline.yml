name: Python CI Pipeline - Sistem Perpustakaan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Mengambil Kode dari Repositori (Checkout)
      uses: actions/checkout@v4

    - name: 2. Menyiapkan Lingkungan Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 3. Menginstal Dependensi Proyek
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Pengecekan Kualitas Kode (Flake8 Linter)
      run: |
        flake8 models/ controller/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 5. Menjalankan Automated Unit Testing (Pytest)
      run: |
        python -m pytest -v
